<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontak - SMA Science Plus Baitul Quran Boarding School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>SMA Science Plus Baitul Quran Boarding School</h1>
        <p>Hubungi Kami</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="program.html">Program Unggulan</a>
        <a href="kontak.html">Kontak</a>
    </nav>

    <!-- Konten -->
    <main>

        <div class="form-kontak">

            <h1>Form Kontak</h1>

            <p>
                Silakan isi formulir berikut untuk menghubungi
                pihak SMA Science Plus Baitul Quran Boarding School.
            </p>

            <form action="#" method="post">

                <label for="nama">Nama Lengkap</label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="contoh@email.com"
                    required
                >

                <label for="pesan">Pesan</label>

                <textarea
                    id="pesan"
                    name="pesan"
                    placeholder="Tuliskan pesan Anda..."
                    required
                ></textarea>

                <button type="submit">
                    Kirim Pesan
                </button>

                <button type="reset">
                    Reset
                </button>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>
            &copy; 2026 SMA Science Plus Baitul Quran Boarding School.
            Hak Cipta Dilindungi.
        </p>
    </footer>

</body>

</html>
